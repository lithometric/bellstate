name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: build & e2e (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: daemon

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build daemon
        run: cargo build --release --manifest-path daemon/Cargo.toml

      - name: Run e2e suite
        run: node test/e2e/run.js
