name: Publish to npm

# Manual trigger: builds the daemon for every platform, generates the
# per-platform binary packages, and publishes everything to npm.
# Requires an NPM_TOKEN repository secret (automation token).

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build ${{ matrix.name }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: linux-x64
            exe: bellstated
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            name: linux-arm64
            exe: bellstated
          - os: macos-latest
            target: aarch64-apple-darwin
            name: darwin-arm64
            exe: bellstated
          - os: macos-latest
            target: x86_64-apple-darwin
            name: darwin-x64
            exe: bellstated
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: win32-x64
            exe: bellstated.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --manifest-path daemon/Cargo.toml --target ${{ matrix.target }}

      - name: Stage binary
        shell: bash
        run: |
          mkdir -p out
          cp "daemon/target/${{ matrix.target }}/release/${{ matrix.exe }}" \
             "out/bellstated-${{ matrix.name }}${{ matrix.exe == 'bellstated.exe' && '.exe' || '' }}"

      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.name }}
          path: out/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - uses: actions/download-artifact@v4
        with:
          path: bins
          merge-multiple: true

      - name: Generate platform packages + inject optionalDependencies
        run: node scripts/gen-platform-packages.js bins --inject

      - name: Publish platform packages
        run: |
          for dir in dist/npm/*/; do
            (cd "$dir" && npm publish --access public)
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish bellstate
        run: npm publish --access public
        working-directory: packages/bellstate
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish framework packages
        run: |
          for pkg in bellstate-react bellstate-vue bellstate-svelte bellstate-angular; do
            (cd "packages/$pkg" && npm publish --access public)
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
