name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: linux-x64
            exe: bellstated
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            name: linux-arm64
            exe: bellstated
          - os: macos-latest
            target: aarch64-apple-darwin
            name: darwin-arm64
            exe: bellstated
          - os: macos-latest
            target: x86_64-apple-darwin
            name: darwin-x64
            exe: bellstated
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: win32-x64
            exe: bellstated.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --manifest-path daemon/Cargo.toml --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          mkdir -p out
          cp "daemon/target/${{ matrix.target }}/release/${{ matrix.exe }}" \
             "out/bellstated-${{ matrix.name }}${{ matrix.exe == 'bellstated.exe' && '.exe' || '' }}"

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
